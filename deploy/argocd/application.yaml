apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metalgrid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jahnavi-yelamanchi/metalgrid.git
    targetRevision: main
    path: deploy/helm
    helm:
      values: |
        webhook:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: metalgrid-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
