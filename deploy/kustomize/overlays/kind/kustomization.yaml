apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local kind overrides: fewer mock devices per node (laptop-sized cluster)
# and an explicit imagePullPolicy so locally `kind load`-ed images are never
# mistakenly re-pulled from a registry.
resources:
  - ../../base
patches:
  - target:
      kind: DaemonSet
      name: metalgrid-devplugin
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "4"
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: metalgrid-scheduler
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
