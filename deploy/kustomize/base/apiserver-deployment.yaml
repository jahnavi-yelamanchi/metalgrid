apiVersion: apps/v1
kind: Deployment
metadata:
  name: metalgrid-apiserver
  namespace: metalgrid-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metalgrid-apiserver
  template:
    metadata:
      labels:
        app: metalgrid-apiserver
    spec:
      serviceAccountName: metalgrid-apiserver
      containers:
        - name: apiserver
          image: metalgrid/apiserver:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - secretRef:
                name: metalgrid-apiserver-secrets
          env:
            - name: JOB_NAMESPACE
              value: default
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metalgrid-apiserver
  namespace: metalgrid-system
spec:
  selector:
    app: metalgrid-apiserver
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metalgrid-apiserver
  namespace: metalgrid-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: metalgrid-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metalgrid-apiserver
  namespace: metalgrid-system
spec:
  podSelector:
    matchLabels:
      app: metalgrid-apiserver
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
