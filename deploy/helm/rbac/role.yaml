---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metalgrid-operator
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metalgrid.dev
  resources:
  - acceleratorjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metalgrid.dev
  resources:
  - acceleratorjobs/finalizers
  verbs:
  - update
- apiGroups:
  - metalgrid.dev
  resources:
  - acceleratorjobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - metalgrid.dev
  resources:
  - acceleratorpools
  - quotapolicies
  verbs:
  - get
  - list
  - watch
