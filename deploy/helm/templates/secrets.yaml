apiVersion: v1
kind: Secret
metadata:
  name: metalgrid-apiserver-secrets
  namespace: {{ .Release.Namespace }}
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres.{{ .Release.Namespace }}.svc:5432/{{ .Values.postgres.database }}"
  NATS_URL: "nats://nats.{{ .Release.Namespace }}.svc:4222"
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  RATE_LIMIT_RPS: {{ .Values.auth.rateLimitRPS | quote }}
  RATE_LIMIT_BURST: {{ .Values.auth.rateLimitBurst | quote }}
  OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: metalgrid-operator-secrets
  namespace: {{ .Release.Namespace }}
stringData:
  NATS_URL: "nats://nats.{{ .Release.Namespace }}.svc:4222"
  OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
