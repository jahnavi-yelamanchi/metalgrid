apiVersion: apps/v1
kind: Deployment
metadata:
  name: metalgrid-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas.operator }}
  selector:
    matchLabels:
      app: metalgrid-operator
  template:
    metadata:
      labels:
        app: metalgrid-operator
    spec:
      serviceAccountName: metalgrid-operator
      containers:
        - name: operator
          image: {{ .Values.images.operator }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --leader-elect=true
            - --leader-election-namespace={{ .Release.Namespace }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook=true
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: 9443
            {{- end }}
          envFrom:
            - secretRef:
                name: metalgrid-operator-secrets
          env:
            - name: JOB_NAMESPACE
              value: default
          startupProbe:
            httpGet: { path: /healthz, port: health }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{ toYaml .Values.resources.small | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: metalgrid-webhook-certs
          {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metalgrid-operator
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: metalgrid-operator
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metalgrid-operator
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: metalgrid-operator
  policyTypes: [Ingress]
  ingress:
    # Metrics (Prometheus) and health probes stay open cluster-wide since
    # they're low-sensitivity; the webhook port (9443) is where the API
    # server calls in and can't be scoped by pod label, so it's open too —
    # TLS + the webhook's own auth is what actually protects that endpoint.
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        {{- if .Values.webhook.enabled }}
        - port: 9443
          protocol: TCP
        {{- end }}
