apiVersion: apps/v1
kind: Deployment
metadata:
  name: metalgrid-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas.apiserver }}
  selector:
    matchLabels:
      app: metalgrid-apiserver
  template:
    metadata:
      labels:
        app: metalgrid-apiserver
    spec:
      serviceAccountName: metalgrid-apiserver
      containers:
        - name: apiserver
          image: {{ .Values.images.apiserver }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - secretRef:
                name: metalgrid-apiserver-secrets
          env:
            - name: JOB_NAMESPACE
              value: default
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{ toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: metalgrid-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: metalgrid-apiserver
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metalgrid-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: metalgrid-apiserver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metalgrid-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: metalgrid-apiserver
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
