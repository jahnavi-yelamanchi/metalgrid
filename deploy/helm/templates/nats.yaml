apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          # -sd points JetStream at the mounted PVC. Without it, "-js" alone
          # still enables JetStream but defaults its store dir to /tmp —
          # ephemeral container filesystem — so every pod restart silently
          # loses all streams/consumers/messages despite the PVC existing
          # and being mounted. Found via the kill-nats chaos drill
          # (hack/chaos/kill-nats.sh): apiserver's connection recovered fine
          # after restart but publishes failed with "no response from
          # stream" because the stream itself no longer existed.
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 8222, name: monitor }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{ toYaml .Values.resources.datastore | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: nats }
  ports:
    - { port: 4222, name: client }
    - { port: 8222, name: monitor }
