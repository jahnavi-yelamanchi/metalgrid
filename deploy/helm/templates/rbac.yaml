apiVersion: v1
kind: ServiceAccount
metadata:
  name: metalgrid-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metalgrid-apiserver
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metalgrid-operator
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["metalgrid.dev"]
    resources: ["acceleratorjobs", "inferenceservices"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["metalgrid.dev"]
    resources: ["acceleratorjobs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["metalgrid.dev"]
    resources: ["acceleratorjobs/status", "inferenceservices/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["metalgrid.dev"]
    resources: ["acceleratorpools", "quotapolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metalgrid-apiserver
rules:
  - apiGroups: ["metalgrid.dev"]
    resources: ["acceleratorjobs"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metalgrid-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metalgrid-operator
subjects:
  - kind: ServiceAccount
    name: metalgrid-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metalgrid-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metalgrid-apiserver
subjects:
  - kind: ServiceAccount
    name: metalgrid-apiserver
    namespace: {{ .Release.Namespace }}
