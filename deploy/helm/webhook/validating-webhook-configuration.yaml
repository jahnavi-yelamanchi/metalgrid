---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: metalgrid-validating-webhook
webhooks:
  - name: vacceleratorjob.metalgrid.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    # caBundle is populated at deploy time (Helm chart / cert-manager injection).
    clientConfig:
      service:
        name: metalgrid-operator-webhook
        namespace: metalgrid-system
        path: /validate-metalgrid-dev-v1alpha1-acceleratorjob
        port: 9443
    rules:
      - apiGroups: ["metalgrid.dev"]
        apiVersions: ["v1alpha1"]
        resources: ["acceleratorjobs"]
        operations: ["CREATE"]
        scope: Namespaced
