---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: inferenceservices.metalgrid.dev
spec:
  group: metalgrid.dev
  names:
    kind: InferenceService
    listKind: InferenceServiceList
    plural: inferenceservices
    singular: inferenceservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: InferenceService runs a model-serving Deployment+Service.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              InferenceServiceSpec describes a model-serving deployment. The backend is
              a mock HTTP server shaped like an OpenAI-style completions endpoint
              (deploy/no real GPU weights needed) — swap Image for a real vLLM/Triton
              image to serve an actual model.
            properties:
              image:
                description: |-
                  Image overrides the serving container image. Defaults to the mock
                  completions server if unset.
                type: string
              model:
                description: |-
                  Model is a label for which model this service serves; the mock
                  backend echoes it back in responses.
                type: string
              replicas:
                default: 1
                description: Replicas is how many serving pods to run.
                format: int32
                minimum: 1
                type: integer
              team:
                description: Team attributes this service to a tenant.
                type: string
            required:
            - model
            - team
            type: object
          status:
            description: InferenceServiceStatus reflects the observed state of an
              InferenceService.
            properties:
              endpoint:
                description: Endpoint is the in-cluster DNS name serving completions
                  requests.
                type: string
              phase:
                description: InferenceServicePhase is the lifecycle phase of an InferenceService.
                type: string
              readyReplicas:
                description: ReadyReplicas mirrors the backing Deployment's ready
                  replica count.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
